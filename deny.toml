# cargo-deny config — https://embarkstudios.github.io/cargo-deny/
# Conservative whitelist; expand as legitimate deps need it.

[advisories]
version = 2
yanked = "warn"
# Each ignore must come with a justification — review quarterly.
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack on rsa crate, reached only via
    # sqlx-mysql which we don't compile (Postgres-only). See
    # .cargo/audit.toml for the full reasoning.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.92
# All licenses that ship in the typical Rust + Axum + sqlx + tokio tree.
# Common permissive set + a few specialized OSS-approved ones.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",  # webpki-roots data files
    "OpenSSL",              # ring/aws-lc legacy attribution
]
# Crates that don't expose a SPDX license but ship clear OSS terms.
# Keep this small — every entry is a manual review.
exceptions = []

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
# Crates we deliberately don't want pulled in.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
