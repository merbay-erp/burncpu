<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint (no flash).
         NOTE: this inline script is allowlisted in the production nginx CSP by
         its SHA-256 hash. If you change its contents, regenerate the hash —
         see docs/DEPLOYMENT.md → Security headers (nginx). -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          if (localStorage.getItem('burncpu.theme') === 'light') {
            el.classList.add('light');
            el.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171311" />
    <meta name="description" content="burncpu.com — 1 VPS yeter. Built for humans who still think before posting." />
    <title>burncpu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=fire" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/atom+xml" title="burncpu — public timeline" href="/rss/all" />

    <!-- Fonts: Geist (UI/body) + Geist Mono (metadata) + Material Symbols.
         Loaded non-render-blocking: preload the CSS (so the download starts early)
         and let main.tsx flip rel→stylesheet once the app boots. We can't use the
         usual inline `onload` swap because our CSP forbids inline event handlers.
         <noscript> keeps the blocking version as a no-JS fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the connection to the dominant link-cover origin. The mobile LCP is
         a timeline cover image served from here; preconnecting shaves the DNS+TLS
         handshake off its load time. Revisit when covers span many origins. -->
    <link rel="preconnect" href="https://mustafaerbay.com.tr" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="burncpu" />
    <meta property="og:title" content="burncpu — 1 VPS yeter" />
    <meta property="og:description" content="Built for humans who still think before posting. Low ego. High signal." />
    <meta property="og:url" content="https://burncpu.com" />
    <meta property="og:image" content="https://burncpu.com/og-card.svg" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="burncpu — 1 VPS yeter" />
    <meta name="twitter:description" content="Built for humans who still think before posting." />
    <meta name="twitter:image" content="https://burncpu.com/og-card.svg" />

    <!-- App-shell splash. burncpu is a client-rendered SPA, so #root is empty
         until the JS bundle boots, fetches, and renders — on a slow/distant
         connection that's several seconds of blank screen (it tanks FCP/Speed
         Index). This static markup is styled by an inline <style> (no external
         CSS, no JS), so it paints at ~TTFB and gives an immediate, on-brand first
         paint. It's position:fixed, so it adds zero layout shift; main.tsx removes
         it the moment the app mounts, and the 12s auto-hide is a failsafe in case
         the bundle never boots. Inline styles are CSP-allowed (style-src
         'unsafe-inline'). -->
    <style>
      #boot-splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;background:#171311;color:#f0e9e3;
        font:700 22px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:-.02em;
        animation:bs-hide 0s linear 12s forwards}
      html.light #boot-splash{background:#faf8f6;color:#241d18}
      #boot-splash i{width:22px;height:22px;border-radius:50%;border:2.5px solid currentColor;
        border-top-color:transparent;opacity:.4;animation:bs-rot .8s linear infinite}
      @keyframes bs-rot{to{transform:rotate(360deg)}}
      @keyframes bs-hide{to{opacity:0;visibility:hidden;pointer-events:none}}
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash">🔥&nbsp;burncpu<i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
