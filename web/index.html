<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved theme before first paint (no flash) -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          if (localStorage.getItem('burncpu.theme') === 'light') {
            el.classList.add('light');
            el.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171311" />
    <meta name="description" content="burncpu.com — 1 VPS yeter. Built for humans who still think before posting." />
    <title>burncpu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=fire" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="alternate" type="application/atom+xml" title="burncpu — public timeline" href="/rss/all" />

    <!-- Fonts: Geist (UI/body) + Geist Mono (metadata) + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="burncpu" />
    <meta property="og:title" content="burncpu — 1 VPS yeter" />
    <meta property="og:description" content="Built for humans who still think before posting. Low ego. High signal." />
    <meta property="og:url" content="https://burncpu.com" />
    <meta property="og:image" content="https://burncpu.com/og-card.svg" />
    <meta property="og:locale" content="tr_TR" />

    <!-- Twitter Card -->

    <meta name="twitter:title" content="burncpu — 1 VPS yeter" />
    <meta name="twitter:description" content="Built for humans who still think before posting." />
    <meta name="twitter:image" content="https://burncpu.com/og-card.svg" />
  </head>

</html>
