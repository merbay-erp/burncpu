name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Run cargo-audit directly rather than rustsec/audit-check@v2, whose
      # latest release tag still ships a deprecated Node 20 runtime.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  cargo-deny:
    name: cargo deny (licenses + bans + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Install cargo-deny from a prebuilt binary (taiki-e/install-action) instead
      # of compiling via `cargo install` (crates.io download intermittently drops the
      # TLS connection: "unexpected eof while reading") or the EmbarkStudios Docker
      # action (Docker Hub pull timeouts). Prebuilt = no Docker, no compile, no flake.
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses bans sources

  build-check:
    name: cargo fmt + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  secret-scan:
    name: gitleaks (committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-mobile:
    name: web + mobile build, audit and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: web — install, audit and production build
        working-directory: web
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
          npm test
          npm run build
      - name: mobile — install, audit, typecheck and lint
        working-directory: mobile
        run: |
          npm ci --no-fund
          npm audit --audit-level=high
          npx tsc --noEmit
          npm run lint
