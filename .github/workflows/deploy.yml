name: Deploy to VPS3

# 19 May 2026 — VPS3'un direkt outbound 443 GitHub'a kapali (firewall politikasi).
# Manuel `git pull` calismiyor. GHA self-hosted runner ise GitHub'a baglaniyor
# (runner kendi cikis bağlantısı varsa OK). Bu workflow runner workdir'inde
# checkout yapar, sonra `/opt/burncpu/app`'e rsync + docker compose rebuild.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'migrations/**'
      - 'static/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: burncpu-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mustafaerbay]
    # 60 (not 30): a Cargo.lock/dep change busts the Docker deps-cache layer,
    # forcing a full cold `cargo build --release` on the VPS runner which can
    # exceed 30m. Cached (source-only) deploys still finish in minutes.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # All deploy logic lives in /usr/local/bin/deploy-burncpu.sh on the host
      # (root-owned, allowlisted for the runner via sudoers — same least-privilege
      # pattern as the mustafaerbay deploy). It rsyncs the backend to
      # /opt/burncpu/app, builds the SPA into the nginx root /opt/burncpu/web,
      # rebuilds the app container (migrations run on startup) and health-gates.
      - name: Deploy (backend + frontend + migrations)
        run: sudo /usr/local/bin/deploy-burncpu.sh "$GITHUB_WORKSPACE"

      - name: Verify deploy
        run: |
          # Fail closed: a release is not successful until the public path
          # (Cloudflare → nginx → app → Postgres/Redis) is healthy.
          curl --fail --show-error --silent \
            --retry 8 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 15 \
            https://burncpu.com/healthz
