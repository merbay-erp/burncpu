# cargo-audit config
# Documented justifications for advisory ignores. Review quarterly.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack on rsa crate.
    # We now use the rsa crate directly (federation HTTP Signatures —
    # ActivityPub spec requires RSA-SHA256). The Marvin Attack is a
    # remote-timing side-channel on private-key decryption; HTTP Signature
    # signing is constant-input (signed headers don't carry attacker-
    # controlled values during sign), and our keys are 2048-bit fresh per
    # user. Risk accepted vs the practical impossibility of federating
    # without RSA. Lift when rsa 0.10 with constant-time primitives lands.
    "RUSTSEC-2023-0071",
]
