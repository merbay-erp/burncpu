# cargo-audit config
# Documented justifications for advisory ignores. Review quarterly.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin Attack on rsa crate via sqlx-mysql.
    # We don't use MySQL (only Postgres); sqlx-mysql appears in Cargo.lock
    # but is not actually compiled (verified with `cargo tree -i sqlx-mysql`
    # which prints nothing). No code path in burncpu reaches the `rsa` crate.
    # Upstream has no patch (timing-channel fix would require constant-time
    # rewrite). Will lift this ignore the moment sqlx ships a fix that
    # excludes sqlx-mysql from default workspace metadata, or rsa 0.10
    # lands with the constant-time fix.
    "RUSTSEC-2023-0071",
]
