[package]
name = "burncpu"
version = "0.1.0"
edition = "2024"
description = "burncpu.com — kendi sosyal medyamız"
license = "MIT"
authors = ["Mustafa Erbay <mustafa@mustafaerbay.com.tr>"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "tracing", "multipart"] }
tokio = { version = "1.42", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "cors", "limit", "timeout"] }

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }

# Cache + Search
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crypto / Auth
argon2 = "0.5"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
signature = "2"

# HTTP client (AI moderation, federation, link previews)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
# Bounded streaming body read for link-preview fetches (hard byte cap)
futures-util = "0.3"

# Config
dotenvy = "0.15"

# Markdown rendering (post body)
pulldown-cmark = "0.12"

# HTML sanitization (XSS protection)
ammonia = "4.0"

# Open Graph / meta extraction for link previews (lightweight, no extra HTML stack)
regex = "1"

# Image processing (EXIF strip + re-encode)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
infer = "0.16"

# Email (SMTP, async)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# TOTP (RFC 6238) + symmetric encryption for stored secrets
totp-rs = { version = "5.6", features = ["otpauth"] }
chacha20poly1305 = "0.10"
base32 = "0.5"
hex = "0.4"

# Web Push (VAPID-signed payloads)
web-push = { version = "0.10", default-features = false, features = ["isahc-client"] }

# ActivityPub HTTP Signatures (RSA-SHA256 standard)
rsa = "0.9"
pkcs1 = "0.7"
pkcs8 = { version = "0.10", features = ["pem"] }
base64 = "0.22"
url = "2"
httpdate = "1"
webauthn-rs = { version = "0.5.5", features = [
    "danger-allow-state-serialisation", # serialize in-flight ceremony state into Redis
    "conditional-ui",                   # discoverable (usernameless) passkey login
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
