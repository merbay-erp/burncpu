name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run cargo-audit directly rather than rustsec/audit-check@v2, whose
      # latest release tag still ships a deprecated Node 20 runtime.
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  cargo-deny:
    name: cargo deny (licenses + bans + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Install cargo-deny from a prebuilt binary (taiki-e/install-action) instead
      # of compiling via `cargo install` (crates.io download intermittently drops the
      # TLS connection: "unexpected eof while reading") or the EmbarkStudios Docker
      # action (Docker Hub pull timeouts). Prebuilt = no Docker, no compile, no flake.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check advisories licenses bans sources

  build-check:
    name: cargo check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test --no-run
      - run: cargo clippy --all-targets -- -D warnings

  secret-scan:
    name: gitleaks (committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-mobile:
    name: web + mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: web — tsc -b
        working-directory: web
        run: |
          npm install --no-fund --no-audit
          npx tsc -b
      - name: mobile — tsc --noEmit
        working-directory: mobile
        run: |
          npm install --no-fund --no-audit
          npx tsc --noEmit
